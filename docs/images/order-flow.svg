<svg xmlns="http://www.w3.org/2000/svg" width="790" height="208" viewBox="0 26 790 208" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">카페 키오스크 주문과 결제</title>
  <desc id="desc">매장·포장 선택에서 메뉴와 옵션을 장바구니에 담고, 결제 수단 선택과 모의 결제를 거쳐 영수증을 표시하는 흐름</desc>
  <style>
    text { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; }
    .box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
    .name, .section { fill: #1e293b; font-weight: 700; }
    .name { font-size: 18px; text-anchor: middle; }
    .section { font-size: 17px; }
    .detail, .label { fill: #475569; font-size: 14px; text-anchor: middle; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-linejoin: round; }
    .tip { fill: #64748b; }
    .rule { stroke: #d8e0e9; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #202d3b; stroke: #718396; }
      .name, .section { fill: #f2f6fb; }
      .detail, .label { fill: #c6d3e1; }
      .arrow { stroke: #a4b5c8; }
      .tip { fill: #a4b5c8; }
      .rule { stroke: #3d4b5a; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <g transform="translate(16 39)">
    <rect class="box" width="178" height="62" rx="10"/>
    <text class="name" x="89" y="27">매장 · 포장</text>
    <text class="detail" x="89" y="48">이용 방식 선택</text>
  </g>
  <g transform="translate(306 39)">
    <rect class="box" width="178" height="62" rx="10"/>
    <text class="name" x="89" y="27">메뉴 · 장바구니</text>
    <text class="detail" x="89" y="48">상품 선택 · 주문 확인</text>
  </g>
  <g transform="translate(596 39)">
    <rect class="box" width="178" height="62" rx="10"/>
    <text class="name" x="89" y="27">옵션 · 수량</text>
    <text class="detail" x="89" y="48">선택 후 장바구니에 담기</text>
  </g>
  <path class="arrow" d="M194 70 H301" marker-end="url(#tip)"/>
  <path class="arrow" d="M484 59 H591" marker-end="url(#tip)"/>
  <path class="arrow" d="M596 81 H489" marker-end="url(#tip)"/>
  <g transform="translate(16 158)">
    <rect class="box" width="178" height="62" rx="10"/>
    <text class="name" x="89" y="27">결제 수단</text>
    <text class="detail" x="89" y="48">수단 선택</text>
  </g>
  <g transform="translate(306 158)">
    <rect class="box" width="178" height="62" rx="10"/>
    <text class="name" x="89" y="27">결제 진행</text>
    <text class="detail" x="89" y="48">모의 결제</text>
  </g>
  <g transform="translate(596 158)">
    <rect class="box" width="178" height="62" rx="10"/>
    <text class="name" x="89" y="27">영수증</text>
    <text class="detail" x="89" y="48">주문 내역 표시</text>
  </g>
  <path class="arrow" d="M395 101 V119 Q395 127 387 127 H113 Q105 127 105 135 V152" marker-end="url(#tip)"/>
  <path class="arrow" d="M194 189 H301" marker-end="url(#tip)"/>
  <path class="arrow" d="M484 189 H591" marker-end="url(#tip)"/>
</svg>
